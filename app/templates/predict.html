<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delay Prediction</title>

```
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
```

</head>

<body>

```
<div class="container">

    <h1>AI Logistics Delay Prediction</h1>

    <div class="form-card">

        <form method="POST">

            <label>Country</label>

            <select name="country" required>
                <option value="">Select Country</option>
                <option>South Africa</option>
                <option>Nigeria</option>
                <option>Uganda</option>
                <option>Vietnam</option>
                <option>Zambia</option>
                <option>Haiti</option>
            </select>

            <label>Shipment Mode</label>

            <select name="shipment_mode" required>
                <option value="">Select Shipment Mode</option>
                <option>Air</option>
                <option>Truck</option>
                <option>Ocean</option>
                <option>Air Charter</option>
            </select>

            <label>Product Group</label>

            <select name="product_group" required>
                <option value="">Select Product Group</option>
                <option>ARV</option>
                <option>HRDT</option>
                <option>ACT</option>
                <option>ANTM</option>
                <option>MRDT</option>
            </select>

            <label>Line Item Quantity</label>
            <input type="number" name="quantity" required>

            <label>Line Item Value</label>
            <input type="number" name="line_value" required>

            <label>Pack Price</label>
            <input type="number" name="pack_price" required>

            <label>Unit Price</label>
            <input type="number" name="unit_price" required>

            <label>Weight (Kilograms)</label>
            <input type="number" step="0.01" name="weight" required>

            <label>Freight Cost (USD)</label>
            <input type="number" step="0.01" name="freight_cost" required>

            <button type="submit">
                Predict Delay
            </button>

        </form>

        {% if prediction %}

        <div class="result-box">

            <h2>{{ prediction }}</h2>

        </div>

        {% endif %}

    </div>

</div>
```

</body>

</html>
